version: '3.8'

services:
  vpvoae:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpvoae-renderer
    restart: on-failure:3
    environment:
      DISPLAY: :99
      OUTPUT_PATH: /app/output
      TARGET_URL: ${TARGET_URL:-https://sleep-well-creatives.com}
      VIEWPORT_WIDTH: ${VIEWPORT_WIDTH:-1920}
      VIEWPORT_HEIGHT: ${VIEWPORT_HEIGHT:-1080}
      RENDER_TIMEOUT: ${RENDER_TIMEOUT:-5000}
      LOAD_TIMEOUT: ${LOAD_TIMEOUT:-60000}
      LOG_LEVEL: INFO
    volumes:
      - ./output:/app/output
      - ./entrypoint.sh:/entrypoint.sh:ro
    cpu_shares: 1024
    mem_limit: 2G
    memswap_limit: 3G
    shm_size: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "test", "-d", "/app/output"]
      interval: 30s
      timeout: 10s
      retries: 3
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

networks:
  shared-network:
    driver: bridge
