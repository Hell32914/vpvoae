version: '3.8'

services:
  vpvoae:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpvoae-renderer
    restart: on-failure:3
    environment:
      DISPLAY: :99
      XVFB_DISPLAY: :99
      XVFB_SCREEN: '0 1920x1080x24'
      LOG_LEVEL: INFO
    volumes:
      - ./output:/app/output
      - ./entrypoint.sh:/entrypoint.sh:ro
    cpu_shares: 1024
    mem_limit: 2G
    memswap_limit: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "test", "-d", "/app/output"]
      interval: 30s
      timeout: 10s
      retries: 3
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

networks:
  shared-network:
    driver: bridge
