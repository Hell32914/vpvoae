services:
  vpvoae:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpvoae-renderer
    restart: on-failure:3
    environment:
      DISPLAY: :99
      OUTPUT_PATH: /app/output
      TARGET_URL: ${TARGET_URL:-https://www.gsproductions.co.za/}
      VIEWPORT_WIDTH: ${VIEWPORT_WIDTH:-1920}
      VIEWPORT_HEIGHT: ${VIEWPORT_HEIGHT:-1080}
      RENDER_TIMEOUT: ${RENDER_TIMEOUT:-5000}
      LOAD_TIMEOUT: ${LOAD_TIMEOUT:-60000}
      BROWSER_FULLSCREEN: ${BROWSER_FULLSCREEN:-true}
      BROWSER_APP_MODE: ${BROWSER_APP_MODE:-true}
      SMART_CURSOR_ENABLED: ${SMART_CURSOR_ENABLED:-true}
      SMART_CURSOR_TIMEOUT: ${SMART_CURSOR_TIMEOUT:-360000}
      SMART_CURSOR_MAX_TARGETS: ${SMART_CURSOR_MAX_TARGETS:-0}
      SMART_CURSOR_HOVER_MIN_MS: ${SMART_CURSOR_HOVER_MIN_MS:-220}
      SMART_CURSOR_HOVER_MAX_MS: ${SMART_CURSOR_HOVER_MAX_MS:-760}
      SMART_CURSOR_ENTRY_CLICK_ENABLED: ${SMART_CURSOR_ENTRY_CLICK_ENABLED:-true}
      SMART_CURSOR_ENTRY_CLICK_ATTEMPTS: ${SMART_CURSOR_ENTRY_CLICK_ATTEMPTS:-3}
      SMART_CURSOR_SCROLL_TO_END: ${SMART_CURSOR_SCROLL_TO_END:-true}
      SMART_CURSOR_BOTTOM_STABLE_ROUNDS: ${SMART_CURSOR_BOTTOM_STABLE_ROUNDS:-4}
      SMART_CURSOR_SCROLL_SPEED: ${SMART_CURSOR_SCROLL_SPEED:-1.25}
      SMART_CURSOR_SCROLL_PAUSE_MIN_MS: ${SMART_CURSOR_SCROLL_PAUSE_MIN_MS:-24}
      SMART_CURSOR_SCROLL_PAUSE_MAX_MS: ${SMART_CURSOR_SCROLL_PAUSE_MAX_MS:-70}
      SMART_CURSOR_SCROLL_FINISH_TIMEOUT_MS: ${SMART_CURSOR_SCROLL_FINISH_TIMEOUT_MS:-45000}
      SMART_CURSOR_STRICT_TOP_TO_BOTTOM: ${SMART_CURSOR_STRICT_TOP_TO_BOTTOM:-true}
      SMART_CURSOR_STRICT_ALLOW_CLICKS: ${SMART_CURSOR_STRICT_ALLOW_CLICKS:-false}
      SMART_CURSOR_REQUIRE_BOTTOM: ${SMART_CURSOR_REQUIRE_BOTTOM:-true}
      SMART_CURSOR_REQUIRE_BOTTOM_MAX_MS: ${SMART_CURSOR_REQUIRE_BOTTOM_MAX_MS:-900000}
      SMART_CURSOR_BOTTOM_DEBUG: ${SMART_CURSOR_BOTTOM_DEBUG:-false}
      SMART_CURSOR_NAV_TABS_VISIT_ENABLED: ${SMART_CURSOR_NAV_TABS_VISIT_ENABLED:-false}
      SMART_CURSOR_NAV_TABS_MAX_VISITS: ${SMART_CURSOR_NAV_TABS_MAX_VISITS:-10}
      SMART_CURSOR_NAV_TAB_SCROLL_TIMEOUT_MS: ${SMART_CURSOR_NAV_TAB_SCROLL_TIMEOUT_MS:-17000}
      SMART_CURSOR_INPAGE_CLICK_ENABLED: ${SMART_CURSOR_INPAGE_CLICK_ENABLED:-true}
      SMART_CURSOR_INPAGE_CLICK_PROBABILITY: ${SMART_CURSOR_INPAGE_CLICK_PROBABILITY:-0.12}
      SMART_CURSOR_ALLOW_INTERNAL_NAV_CLICK: ${SMART_CURSOR_ALLOW_INTERNAL_NAV_CLICK:-false}
      SCREENSHOT_ENABLED: ${SCREENSHOT_ENABLED:-true}
      SCREENSHOT_TIMEOUT_MS: ${SCREENSHOT_TIMEOUT_MS:-8000}
      FFMPEG_AUTO_CROP_BROWSER_UI: ${FFMPEG_AUTO_CROP_BROWSER_UI:-true}
      FFMPEG_FRAMERATE: ${FFMPEG_FRAMERATE:-24}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-ultrafast}
      FFMPEG_CRF: ${FFMPEG_CRF:-23}
      FFMPEG_CROP_TOP: ${FFMPEG_CROP_TOP:-0}
      LOG_LEVEL: INFO
    volumes:
      - vpvoae-output:/app/output
    cpu_shares: ${CPU_SHARES:-1024}
    mem_limit: ${MEMORY_LIMIT:-2G}
    memswap_limit: ${MEMSWAP_LIMIT:-3G}
    shm_size: ${SHM_SIZE:-2G}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "test", "-d", "/app/output"]
      interval: 30s
      timeout: 10s
      retries: 3
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

networks:
  shared-network:
    driver: bridge

volumes:
  vpvoae-output:
    driver: local
