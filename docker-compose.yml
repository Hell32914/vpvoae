version: '3.8'

services:
  vpvoae:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpvoae-renderer
    restart: on-failure:3
    environment:
      DISPLAY: :100
      XVFB_DISPLAY: :100
      XVFB_SCREEN: '0 1920x1080x24'
      LOG_LEVEL: INFO
    volumes:
      - ./output:/app/output
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    cpu_shares: 1024
    mem_limit: 2G
    memswap_limit: 3G
    # Логирование - не заполняет диск
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    # Если нужно взаимодействие с другими контейнерами
    networks:
      - shared-network
    # Стартовая задержка для стабильности
    healthcheck:
      test: ["CMD", "test", "-d", "/app/output"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  shared-network:
    driver: bridge
    # Опционально - подключиться к существующей сети if needed
    # external: true
    # name: existing_network_name
