version: '3.8'

services:
  vpvoae:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpvoae-renderer
    restart: on-failure:3
    environment:
      DISPLAY: :99
      OUTPUT_PATH: /app/output
      TARGET_URL: ${TARGET_URL:-https://www.gsproductions.co.za/}
      VIEWPORT_WIDTH: ${VIEWPORT_WIDTH:-1920}
      VIEWPORT_HEIGHT: ${VIEWPORT_HEIGHT:-1080}
      RENDER_TIMEOUT: ${RENDER_TIMEOUT:-5000}
      LOAD_TIMEOUT: ${LOAD_TIMEOUT:-60000}
      BROWSER_FULLSCREEN: ${BROWSER_FULLSCREEN:-true}
      BROWSER_APP_MODE: ${BROWSER_APP_MODE:-true}
      SMART_CURSOR_ENABLED: ${SMART_CURSOR_ENABLED:-true}
      SMART_CURSOR_TIMEOUT: ${SMART_CURSOR_TIMEOUT:-45000}
      SMART_CURSOR_MAX_TARGETS: ${SMART_CURSOR_MAX_TARGETS:-24}
      SMART_CURSOR_HOVER_MIN_MS: ${SMART_CURSOR_HOVER_MIN_MS:-450}
      SMART_CURSOR_HOVER_MAX_MS: ${SMART_CURSOR_HOVER_MAX_MS:-1300}
      SMART_CURSOR_ENTRY_CLICK_ENABLED: ${SMART_CURSOR_ENTRY_CLICK_ENABLED:-true}
      SMART_CURSOR_ENTRY_CLICK_ATTEMPTS: ${SMART_CURSOR_ENTRY_CLICK_ATTEMPTS:-2}
      SMART_CURSOR_SCROLL_TO_END: ${SMART_CURSOR_SCROLL_TO_END:-true}
      SMART_CURSOR_BOTTOM_STABLE_ROUNDS: ${SMART_CURSOR_BOTTOM_STABLE_ROUNDS:-3}
      SMART_CURSOR_SCROLL_SPEED: ${SMART_CURSOR_SCROLL_SPEED:-1.15}
      SMART_CURSOR_SCROLL_PAUSE_MIN_MS: ${SMART_CURSOR_SCROLL_PAUSE_MIN_MS:-40}
      SMART_CURSOR_SCROLL_PAUSE_MAX_MS: ${SMART_CURSOR_SCROLL_PAUSE_MAX_MS:-95}
      SMART_CURSOR_SCROLL_FINISH_TIMEOUT_MS: ${SMART_CURSOR_SCROLL_FINISH_TIMEOUT_MS:-22000}
      SMART_CURSOR_NAV_TABS_VISIT_ENABLED: ${SMART_CURSOR_NAV_TABS_VISIT_ENABLED:-true}
      SMART_CURSOR_NAV_TABS_MAX_VISITS: ${SMART_CURSOR_NAV_TABS_MAX_VISITS:-10}
      SMART_CURSOR_NAV_TAB_SCROLL_TIMEOUT_MS: ${SMART_CURSOR_NAV_TAB_SCROLL_TIMEOUT_MS:-17000}
      SMART_CURSOR_INPAGE_CLICK_ENABLED: ${SMART_CURSOR_INPAGE_CLICK_ENABLED:-true}
      SMART_CURSOR_INPAGE_CLICK_PROBABILITY: ${SMART_CURSOR_INPAGE_CLICK_PROBABILITY:-0.28}
      SMART_CURSOR_ALLOW_INTERNAL_NAV_CLICK: ${SMART_CURSOR_ALLOW_INTERNAL_NAV_CLICK:-true}
      FFMPEG_AUTO_CROP_BROWSER_UI: ${FFMPEG_AUTO_CROP_BROWSER_UI:-true}
      FFMPEG_FRAMERATE: ${FFMPEG_FRAMERATE:-24}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-ultrafast}
      FFMPEG_CRF: ${FFMPEG_CRF:-23}
      FFMPEG_CROP_TOP: ${FFMPEG_CROP_TOP:-0}
      LOG_LEVEL: INFO
    volumes:
      - vpvoae-output:/app/output
    cpu_shares: 1024
    mem_limit: 2G
    memswap_limit: 3G
    shm_size: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "test", "-d", "/app/output"]
      interval: 30s
      timeout: 10s
      retries: 3
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

networks:
  shared-network:
    driver: bridge

volumes:
  vpvoae-output:
    driver: local
